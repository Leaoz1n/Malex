<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Malex</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="login-container">

  <img src="assets/img/logo.jpeg" class="logo-login" alt="Logo JRTecnologia">

  <h2>Sistema Malex</h2>

  <input type="text" placeholder="Usuário" id="user">

  <div class="senha-area">
    <input type="password" placeholder="Senha" id="pass">
    <button type="button" class="olho-btn" onclick="mostrarSenha()">👁</button>
  </div>

  <button onclick="login()">Entrar</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>

<script>
  document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      login();
    }
  });

  function mostrarSenha() {
    const senha = document.getElementById("pass");
    senha.type = senha.type === "password" ? "text" : "password";
  }
</script>

</body>
</html>
