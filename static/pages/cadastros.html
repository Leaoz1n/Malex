<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guarda-volumes - Sistema Malex</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="topbar">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="evento-topo" id="eventoTopo">Global</div>
  <img src="../assets/img/logo.jpeg" class="logo-topo" alt="Logo JRTecnologia">
</div>

<div class="sidebar hidden" id="sidebar">
  <div>
    <a href="dashboard.html" data-role="Master,Supervisor,Operador">Dashboard</a>
    <a href="eventos.html" data-role="Master">Eventos</a>
    <a href="usuarios.html" data-role="Master">Usuários</a>
    <a href="cadastros.html" data-role="Master,Supervisor,Operador">Guarda-volumes</a>
    <a href="vendas.html" data-role="Master,Supervisor,Operador">Vendas</a>
    <a href="relatorios.html" data-role="Master,Supervisor">Relatórios</a>
    <a href="configuracoes.html" data-role="Master">Configurações</a>
  </div>

  <div class="menu-user" id="menuUserInfo"></div>
</div>

<div class="main">
  <h1>Guarda-volumes</h1>

  <div id="statusOffline" class="offline-status"></div>

  <div class="card">
    <h3>Novo Cadastro</h3>

    <select id="eventoOperacao" class="selectEventos" onchange="atualizarCamposOperacao(); atualizarValorTotalPreview(); listarOperacoes();"></select>

    <input id="nomeCliente" placeholder="Nome">

    <input
      type="text"
      id="telefoneCliente"
      placeholder="(11) 99999-9999"
      maxlength="15"
      oninput="mascaraTelefone(this)"
    >

    <div id="campoCPF" style="display:none;">
      <input id="cpfCliente" placeholder="CPF">
    </div>

    <div id="campoEmail" style="display:none;">
      <input id="emailCliente" placeholder="E-mail">
    </div>

    <input id="quantidadeVolumes" type="number" placeholder="Quantidade de Volumes" oninput="gerarCamposMalas(); atualizarValorTotalPreview();">

    <div id="camposMalas"></div>

    <div class="total-preview" id="valorTotalPreview">Total: R$ 0,00</div>

    <h4>Forma de Pagamento</h4>
    <div id="pagamentosOperacao" class="pagamentos-linha"></div>

    <input id="observacoes" placeholder="Observações">

    <button onclick="registrarOperacao()">Cadastrar Guarda-volumes</button>
    <button onclick="sincronizarCadastrosOffline()">Sincronizar pendentes</button>
  </div>

  <h2>Cadastros</h2>

  <div class="card">
    <select id="tipoPesquisaCadastro" onchange="listarOperacoes()">
      <option value="nome">Nome</option>
      <option value="telefone">Telefone</option>
      <option value="cpf">CPF</option>
      <option value="mala">Número da Mala</option>
    </select>

    <input id="pesquisaCadastro" placeholder="Pesquisar" oninput="listarOperacoes()">
  </div>

  <div id="listaOperacoes"></div>
</div>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/menu.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/cadastros-supabase.js"></script>

<script>
  iniciarTelaCadastros();
</script>

</body>
</html>
