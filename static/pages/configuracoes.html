<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - Sistema Malex</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="topbar">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="evento-topo" id="eventoTopo">Global</div>
  <img src="../assets/img/logo.jpeg" class="logo-topo" alt="Logo JRTecnologia">
</div>

<div class="sidebar hidden" id="sidebar">
  <div>
    <a href="dashboard.html" data-role="Master,Supervisor,Operador">Dashboard</a>
    <a href="eventos.html" data-role="Master">Eventos</a>
    <a href="usuarios.html" data-role="Master">Usuários</a>
    <a href="cadastros.html" data-role="Master,Supervisor,Operador">Guarda-volumes</a>
    <a href="vendas.html" data-role="Master,Supervisor,Operador">Vendas</a>
    <a href="relatorios.html" data-role="Master,Supervisor">Relatórios</a>
    <a href="configuracoes.html" data-role="Master">Configurações</a>
  </div>

  <div class="menu-user" id="menuUserInfo"></div>
</div>

<div class="main">
  <h1>Configurações</h1>

  <div class="card">
    <h3>Selecionar Evento</h3>
    <select id="eventoConfig" class="selectEventos" onchange="carregarConfiguracaoImpressora()"></select>
  </div>

  <div class="card">
    <h3>Impressora / Etiqueta por Evento</h3>

    <input id="nomeImpressora" placeholder="Nome da impressora. Ex: Argox OS-214">
    <input id="larguraEtiqueta" type="number" placeholder="Largura da etiqueta em mm. Ex: 89">
    <input id="alturaEtiqueta" type="number" placeholder="Altura da etiqueta em mm. Ex: 40">
    <input id="margemEtiqueta" type="number" placeholder="Margem interna em mm. Ex: 4">
    <input id="fonteMalaEtiqueta" type="number" placeholder="Fonte do número da mala. Ex: 24">

    <button onclick="salvarConfiguracaoImpressora()">Salvar Configuração</button>
    <button onclick="carregarPadraoEtiqueta()">Usar padrão 89x40</button>
    <button onclick="visualizarEtiquetaTeste()">Visualizar etiqueta teste</button>

    <p><small>Para testar sem gastar etiqueta, escolha “Salvar como PDF” na janela de impressão.</small></p>
  </div>
</div>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/menu.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/cadastros-supabase.js"></script>
<script src="../assets/js/configuracoes-supabase.js"></script>

<script>
  iniciarTelaConfiguracoes();
</script>
</body>
</html>
