<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trocar Senha - Sistema Malex</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="login-container">
  <img src="../assets/img/logo.jpeg" class="logo-login" alt="Logo JRTecnologia">

  <h2>Alterar Senha</h2>
  <p>Por segurança, altere sua senha no primeiro acesso.</p>

  <input type="password" id="novaSenha" placeholder="Nova senha">
  <input type="password" id="confirmarSenha" placeholder="Confirmar senha">

  <button onclick="alterarSenhaPrimeiroAcesso()">Salvar nova senha</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>

<script>
async function alterarSenhaPrimeiroAcesso() {
  const novaSenha = document.getElementById("novaSenha").value;
  const confirmarSenha = document.getElementById("confirmarSenha").value;

  if (!novaSenha || !confirmarSenha) {
    alert("Preencha os dois campos.");
    return;
  }

  if (novaSenha !== confirmarSenha) {
    alert("As senhas não conferem.");
    return;
  }

  let user = JSON.parse(localStorage.getItem("user"));

  if (!user) {
    window.location.href = "../login.html";
    return;
  }

  if (user.login === "Jess_") {
    user.primeiroAcesso = false;
    user.alterarSenhaObrigatoria = false;
    localStorage.setItem("user", JSON.stringify(user));
    window.location.href = "dashboard.html";
    return;
  }

  const { error } = await supabaseClient
    .from("usuarios")
    .update({
      senha: novaSenha,
      primeiro_acesso: false,
      alterar_senha_obrigatoria: false
    })
    .eq("id", user.id);

  if (error) {
    alert("Erro ao alterar senha: " + error.message);
    console.error(error);
    return;
  }

  user.primeiroAcesso = false;
  user.alterarSenhaObrigatoria = false;

  localStorage.setItem("user", JSON.stringify(user));

  alert("Senha alterada com sucesso!");
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
